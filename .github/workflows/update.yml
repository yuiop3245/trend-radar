name: 시세 갱신 + 페이지 배포

on:
  schedule:
    # 시간은 UTC. 미국 장중(서머타임 포함) 30분마다
    - cron: "5,35 13-20 * * 1-5"
    # 장 마감 뒤 일봉 확정 (한국시간 06:50 / 서머타임 05:50 무렵)
    - cron: "50 21 * * 1-5"
    # 한국 장중 (한국시간 09:05~15:35) 30분마다 + 마감 뒤 한 번
    - cron: "5,35 0-6 * * 1-5"
    - cron: "45 6 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      alert:
        description: "텔레그램 알림 (none: 안 보냄 / test: 연결 확인 / us·kr: 오늘 확정 신호)"
        type: choice
        options: [none, test, us, kr]
        default: none

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install yfinance

      - name: 시세 받기
        run: python scripts/update_data.py

      - name: 신호 알림 (텔레그램)
        # 장 마감 뒤 실행(미국 21:50 UTC, 국내 06:45 UTC) 또는 수동 실행에서 고른 경우에만
        if: (github.event_name == 'schedule' && (github.event.schedule == '50 21 * * 1-5' || github.event.schedule == '45 6 * * 1-5')) || (github.event_name == 'workflow_dispatch' && inputs.alert != 'none')
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MARKET: ${{ github.event_name == 'workflow_dispatch' && inputs.alert || (github.event.schedule == '45 6 * * 1-5' && 'kr' || 'us') }}
        run: node scripts/alert.mjs

      - name: 배포 폴더 준비
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
