name: 시세 갱신 + 페이지 배포

on:
  schedule:
    # 시간은 UTC. 미국 장중(서머타임 포함) 30분마다
    - cron: "5,35 13-20 * * 1-5"
    # 장 마감 뒤 일봉 확정 (한국시간 06:50 / 서머타임 05:50 무렵)
    - cron: "50 21 * * 1-5"
    # 한국 장중 (한국시간 09:05~15:35) 30분마다 + 마감 뒤 한 번
    - cron: "5,35 0-6 * * 1-5"
    - cron: "45 6 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 국내 시세 패키지 설치 (실패해도 계속 — 그땐 야후 일봉 사용)
        run: pip install -r requirements-kr.txt || echo "국내 패키지 설치 실패"

      - name: 코스피200·코스닥150 저장분 불러오기 (구성종목 목록·마감 뒤 일봉 재사용)
        uses: actions/cache/restore@v4
        with:
          path: .uni_cache
          key: uni-${{ github.run_id }}
          restore-keys: uni-

      - name: 시세 받기
        run: python scripts/update_data.py

      - name: 코스피200·코스닥150 저장
        if: always() && hashFiles('.uni_cache/data_kr.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .uni_cache
          key: uni-${{ github.run_id }}

      - name: 배포 폴더 준비
        run: |
          mkdir -p _site
          cp index.html _site/
          cp data.json _site/
          if [ -f data_kr.json ]; then cp data_kr.json _site/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
