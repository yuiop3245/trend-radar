name: 시세 갱신 + 페이지 배포

on:
  schedule:
    # 시간은 UTC. 미국 장중(서머타임 포함) 30분마다
    - cron: "5,35 13-20 * * 1-5"
    # 장 마감 뒤 일봉 확정 (한국시간 06:50 / 서머타임 05:50 무렵)
    - cron: "50 21 * * 1-5"
    # 한국 장중 (한국시간 09:05~15:35) 30분마다 + 마감 뒤 한 번
    - cron: "5,35 0-6 * * 1-5"
    - cron: "45 6 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 국내 시세 패키지 설치 (실패해도 계속 — 그땐 야후 일봉 사용)
        run: pip install -r requirements-kr.txt || echo "국내 패키지 설치 실패"

      - name: 한투 캐시 불러오기 (토큰·일봉 재사용 — 토큰 알림톡을 하루 1번 정도로)
        uses: actions/cache/restore@v4
        with:
          path: .kis_cache
          key: kis-${{ github.run_id }}
          restore-keys: kis-

      - name: 시세 받기
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          # 3단계 실전 주문 스위치 — 저장소 Settings → Secrets and variables → Actions → Variables 의 LIVE_TRADING (on 일 때만 주문)
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
        run: python scripts/update_data.py

      - name: 한투 캐시 저장
        if: always() && hashFiles('.kis_cache/cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .kis_cache
          key: kis-${{ github.run_id }}

      - name: 배포 폴더 준비
        run: |
          mkdir -p _site
          cp index.html _site/
          # 잠금(SITE_PASSWORD)이 켜져 있으면 암호화된 data.bin 만 배포 — 평문 data.json 은 올리지 않음
          if [ -f data.bin ]; then cp data.bin _site/; else cp data.json _site/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
